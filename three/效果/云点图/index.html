<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title></title>
    <style>
        body { margin: 0; }
    </style>
    <link rel="stylesheet" href="../../css/dat.gui.css">
    <script src="../../3d/dat.gui.js"></script>
</head>
<body>
<canvas id="canvas" class="c2d" width="1000" height="500"></canvas>
</body>
<script type="module">
    import * as THREE from '../../3d/three.module.js';
    import { OrbitControls }  from '../../3d/OrbitControls.js'
    import { GLTFLoader }  from '../../loaders/GLTFLoader.js';
    import { RoomEnvironment }  from '../../environments/RoomEnvironment.js';
    import TWEEN from "../../js/tween.module.js";

    //********************************↓COMMON↓***************************************
    const gui = new GUI({width:314})
    const gltfLoader = new GLTFLoader()
    const canvas = document.querySelector('#canvas')
    canvas.height = window.innerHeight
    canvas.width = window.innerWidth

    let scene,camera,renderer,controls

    const fov = 40
    const aspect =  window.innerWidth/  window.innerHeight
    const near = 0.1
    const far = 1000

    scene = new THREE.Scene()
    scene.background = new THREE.Color('#232323')

    camera = new THREE.PerspectiveCamera(fov, aspect, near, far)
    camera.position.set(5, 5, 5)
    // camera.lookAt(-10,-10, -10)


    renderer = new THREE.WebGLRenderer({ canvas })
    renderer.setAnimationLoop(renderLoop);
    renderer.shadowMap.enabled = true;

    // 控制相机
    controls = new OrbitControls(camera, canvas)
    // controls.target = new THREE.Vector3(-1, -1,-1)



    window.addEventListener('resize', onWindowResized);

    function onWindowResized() {
        renderer.setSize(window.innerWidth, window.innerHeight);

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

    }

    function renderLoop(){
        renderer.render( scene, camera );
    }

    //********************************↑COMMON↑***************************************
    const params = {
        percentage: 0
    }
    scene.environment = new THREE.PMREMGenerator(renderer).fromScene(
        new RoomEnvironment(),
        0.04
    ).texture;

    let model = null
    let previousPointCloudPositions = null
    let pointCloud = null
    const curve = new THREE.SplineCurve( [
        new THREE.Vector2( -10, 0 ),
        new THREE.Vector2( -5, 5 ),
        new THREE.Vector2( 0, 0 ),
        new THREE.Vector2( 5, -5 ),
        new THREE.Vector2( 10, 0 )
    ] );

    init()
   async function init(){
       model =  await loadModel()
       scene.add(model.scene)
       createPointCloud(model.scene)
       // animatePointsToTarget(pointCloud);
    }
    function loadModel(){
        return new Promise((resolve)=>{
            gltfLoader.load('./ferrari_f50_1995.glb',(gltf)=>{
                gltf.scene.visible = false
                resolve(gltf)
            })
        })
    }

    function createPointCloud(mesh){
        const geometry = new THREE.BufferGeometry();
        const vertices = [];

        mesh.updateMatrixWorld(true);
        mesh.traverse((child) => {
            if (child instanceof THREE.Mesh) {
                const vertex = new THREE.Vector3();
                const positions = child.geometry.attributes.position;
                for (let i = 0; i < positions.count; i+= 5) {
                    vertex.fromBufferAttribute(positions, i);
                    vertex.applyMatrix4(child.matrixWorld);
                    vertices.push(vertex.x, vertex.y, vertex.z);
                }
            }
        })

        let initialPositions = new Float32Array(vertices.length);
        for (let i = 0; i < initialPositions.length; i +=3) {
            initialPositions[i] = (Math.random() - 0.5) * 10;
            initialPositions[i + 1] = (Math.random() - 0.5) * 10;
            initialPositions[i + 2] = (Math.random() - 0.5) * 10;
        }
        geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(initialPositions, 3)
        );

        const material = new THREE.PointsMaterial({
            size: 0.005,
            color: 0xffffff,
        });

        pointCloud = new THREE.Points(geometry, material);
        pointCloud.visible = true

        pointCloud.userData.targets = [];
        pointCloud.userData.speeds = [];

        for (let i = 0; i < vertices.length; i += 3) {
            pointCloud.userData.targets.push(new THREE.Vector3(vertices[i], vertices[i + 1], vertices[i + 2]));
            pointCloud.userData.speeds.push(
                Math.random() > 0.6
                    ? Math.random() * 0.005 + 0.0005
                    : Math.random() * 0.0005
            );
        }
        const targets = pointCloud.userData.targets;
        const positions = pointCloud.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
            positions.array[i * 3] = targets[i].x
            positions.array[i * 3 + 1] = targets[i].y
            positions.array[i * 3 + 2] = targets[i].z
        }

        // scene.add(pointCloud);
        previousPointCloudPositions = Array.from(vertices);

        const pointsCloudToHole = new PointsCloudToHole({object:pointCloud})
        pointsCloudToHole.startAnimation()
        scene.add(pointsCloudToHole.points)

        gui.add(params, "percentage").min(0).max(1).step(0.001).onChange(value=>{
            pointsCloudToHole.update(value)
        })
    }


    function animatePointsToTarget(pointCloud) {
        const positions = pointCloud.geometry.attributes.position;
        const targets = pointCloud.userData.targets;
        const speeds = pointCloud.userData.speeds;

        const progresses = new Array(positions.count).fill(0);

        const animatePoints = () => {
            let allPointsReachedTarget = true;
            for (let i = 0; i < positions.count; i++) {
                progresses[i] += speeds[i];
                if (progresses[i] > 1) progresses[i] = 1;
                else allPointsReachedTarget = false;

                positions.array[i * 3] = THREE.MathUtils.lerp(
                    positions.array[i * 3],
                    targets[i].x,
                    progresses[i]
                );
                positions.array[i * 3 + 1] = THREE.MathUtils.lerp(
                    positions.array[i * 3 + 1],
                    targets[i].y,
                    progresses[i]
                );
                positions.array[i * 3 + 2] = THREE.MathUtils.lerp(
                    positions.array[i * 3 + 2],
                    targets[i].z,
                    progresses[i]
                );
            }
            positions.needsUpdate = true;

            if (!allPointsReachedTarget) {
                requestAnimationFrame(animatePoints);
            } else {
                previousPointCloudPositions = Array.from(positions.array);
            }
        }
        animatePoints()
    }

    function integrate(f, a, b, n) {
        const h = (b - a) / n;
        let sum = 0.5 * (f(a) + f(b));
        for (let i = 1; i < n; i++) {
            sum += f(a + i * h);
        }
        return sum * h;
    }

    function arcLength(x) {
        return Math.sqrt(1 + 1 / (x * x));
    }

    function totalArcLength(a, b, n) {
        return integrate(arcLength, a, b, n);
    }
    function findXForArcLength(targetLength, a, b, n) {
        const tolerance = 1e-6;
        let low = a;
        let high = b;
        while (high - low > tolerance) {
            const mid = (low + high) / 2;
            const length = totalArcLength(a, mid, n);
            if (length < targetLength) {
                low = mid;
            } else {
                high = mid;
            }
        }
        return (low + high) / 2;
    }

function divideCurve(a, b, n, segments) {
        const totalLength = totalArcLength(a, b, n);
        const segmentLength = totalLength / segments;
        const points = [];
        for (let i = 1; i <= segments; i++) {
            const targetLength = i * segmentLength;
            const x = findXForArcLength(targetLength, a, b, n);
            const y = Math.log(x);
            points.push({ x, y });
        }
        return points;
    }
    class PointsCloudToHole {
        animateRequestID = null;
        action = null;
        endCallback;
        constructor({ object, allTime, delayPct, easing, endCallback = () => {} }) {
            allTime = allTime || 5000;
            delayPct = delayPct || 0;
            easing = easing || TWEEN.Easing.Sinusoidal.InOut;
            this.endCallback = endCallback;
            let position1 = object.geometry.attributes.position;
            function findMaxN(x) {
                const discriminant = Math.sqrt(225 + 8 * x);
                const n = Math.floor((-15 + discriminant) / 2);
                return n;
            }
            const maxN = findMaxN(position1.count);
            const count = (maxN * maxN + 15 * maxN) * 0.5;
            const vertices1 = [],
                vertices2 = [],
                delays = [];
            for (let i = 0; i < position1.count; i++) {
                const x1 = position1.getX(i);
                const y1 = position1.getY(i);
                const z1 = position1.getZ(i);
                vertices1.push(x1, y1, z1);
            }

            const a = 0.03;
            const b = Math.E * 2;
            const n = maxN * 50; // 积分的步数
            const segments = maxN; // 分割的段数

            const points = divideCurve(a, b, n, segments);

            for (let i = 0; i < maxN; i++) {
                const r = points[i].x * 0.4;
                for (let j = 0; j < 8 + i; j++) {
                    const p = (j / (8 + i)) * Math.PI * 2;
                    let x = r * Math.cos(p);
                    let z = r * Math.sin(p);
                    let y = points[i].y * 0.2 - 0.5;

                    // 定义旋转角度 a（以弧度为单位）
                    // let a = Math.PI / 10; // 例如，旋转45度
                    // 绕 x 轴旋转
                    // y = y * Math.cos(a) - z * Math.sin(a);
                    // z = y * Math.sin(a) + z * Math.cos(a);
                    vertices2.push(x, y, z);
                    delays.push((Math.random() * 0.3 + 0.7) * (i / maxN) * delayPct);
                }
            }
            for (let i = 0; i < position1.count - count; i++) {
                const x = vertices2[3 * i];
                const y = vertices2[3 * i + 1];
                const z = vertices2[3 * i + 2];
                vertices2.push(x, y, z);
                delays.push(Math.random() * delayPct);
            }

            const geometry = new THREE.BufferGeometry();

            geometry.setAttribute(
                "position",
                new THREE.Float32BufferAttribute(vertices1, 3)
            );
            geometry.setAttribute(
                "target",
                new THREE.Float32BufferAttribute(vertices2, 3)
            );
            geometry.setAttribute("delay", new THREE.Float32BufferAttribute(delays, 1));
            geometry.setDrawRange(0, position1.count);

            const material = this.getMaterial({
                color: 0xffffff,
                size: 1,
            });
            this.points = new THREE.Points(geometry, material);
            this.animationInit(1 + delayPct, allTime, easing, this.endCallback);
        }

        // 创建材质
        getMaterial(options) {
            options = Object.assign(
                {
                    color: 0xffffff,
                    size: 1,
                    map: null
                },
                options
            );
            this.uniforms = {
                color: { value: new THREE.Color(options.color) },
                size: { value: options.size },
                map: { value: options.map },
                percent: { value: 0 },
                time: { value: 0 },
            };
            const material = new THREE.ShaderMaterial({
                // transparent: true,
                depthTest: true,
                depthWrite: true,
                // blending: THREE.AdditiveBlending,
                uniforms: this.uniforms,
                vertexShader: `
                  attribute float delay;
                  attribute vec3 target;
                  uniform float percent;
                  uniform float size;
                  uniform float time;
                  void main() {
                    float p = clamp(percent - delay,0.0,1.0);  //进程百分比
                    vec3 _position = mix( position,target,p);  //根据进程百分比插值计算当前位置
                    float distance = sqrt(_position.x*_position.x + _position.z*_position.z);
                    _position.y += sqrt(distance)*sin(distance*10.0-time)*0.05*p*p;
                    vec4 mvPosition = modelViewMatrix * vec4(_position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize =  (8.0 / -mvPosition.z)*size;
                  }
                `,
                fragmentShader: `
                  uniform vec3 color;
                  uniform sampler2D map;
                  void main() {
                    gl_FragColor = vec4(color, 1.0);
                            // gl_FragColor = gl_FragColor * texture2D( map, gl_PointCoord );
                  }
            `,
            });
            // gui.add(material.uniforms.percent, "value", 0, 2, 0.01);
            return material;
        }

        /**
         * 初始化动画，设置切换进程的百分比、持续时间和缓动函数。
         * @param {number} percent - 切换进程的百分比。
         * @param {number} duration - 动画的持续时间，默认为 2000 毫秒。
         * @param {Function} easing - 动画的缓动函数，默认为 TWEEN.Easing.Sinusoidal.InOut。
         * @param {Function} endCallback - 动画结束时的回调函数，默认为空。
         * @returns {TWEEN} - 返回一个Tween对象，用于控制动画。
         */
        animationInit(
            percent,
            duration = 2000,
            easing = TWEEN.Easing.Sinusoidal.InOut,
            endCallback = () => {}
        ) {
            if (this.action) {
                this.action = null;
            }
            this.action = new TWEEN.Tween(this.uniforms.percent)
                .to({ value: percent }, duration)
                .easing(easing)
                .onUpdate((obj) => {
                    this.points.rotation.x = Math.PI / 16*obj.value;
                })
                .onComplete((res) => {
                    cancelAnimationFrame(this.animateRequestID);
                    this.animateRequestID = null;
                    endCallback();
                })
                .onStop(() => {
                    cancelAnimationFrame(this.animateRequestID);
                    this.animateRequestID = null;
                    endCallback();
                });
            this.animateRequestID = null;
            // this.startAnimation();
        }

        // 开始动画
        startAnimation() {
            if (this.animateRequestID) return;

            this.action.start();
            const animate = () => {
                this.animateRequestID = requestAnimationFrame(animate);
                TWEEN.update();
            };
            animate();
        }

        // 停止动画
        stopAnimation() {
            if (!this.animateRequestID) return;
            this.action.stop();
        }

        // 更新波动动画
        update(delta) {
            this.uniforms.time.value += delta;
        }
    }
</script>
</html>
